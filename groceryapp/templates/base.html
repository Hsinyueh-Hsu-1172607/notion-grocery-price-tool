<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Grocery Price Tool{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,550&family=Pinyon+Script&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="masthead">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="brand-title">Grocery Price Comparison Tool</span>
    </a>
    <p class="tagline">Notion Powered</p>
    {# Signed out there is only one place to go, so the nav is just noise. #}
    {% if session.get('signed_in') %}
    <nav class="nav">
      {% set page = request.endpoint %}
      <a href="{{ url_for('index') }}"
         class="{% if page == 'index' %}active{% endif %}">Home</a>
      <a href="{{ url_for('spending') }}"
         class="{% if page == 'spending' %}active{% endif %}">Spending</a>
      <a href="{{ url_for('upload') }}"
         class="{% if page == 'upload' %}active{% endif %}">Scan Receipt</a>
      <a href="{{ url_for('expense') }}"
         class="{% if page == 'expense' %}active{% endif %}">Add Expense</a>
      <a href="{{ url_for('compare') }}"
         class="{% if page == 'compare' %}active{% endif %}">Price History</a>
      <a class="nav-quiet" href="{{ url_for('logout') }}">Sign out</a>
    </nav>
    {% endif %}
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
