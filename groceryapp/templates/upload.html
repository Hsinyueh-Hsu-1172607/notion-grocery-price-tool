{% extends "base.html" %}
{% block title %}掃描收據 - Grocery Price Tool{% endblock %}
{% block content %}
  <h1>掃描收據</h1>
  <p>用手機瀏覽器開啟這個頁面會直接叫出相機;電腦則會跳出檔案選擇視窗。
     辨識結果會直接寫進你的 Notion 資料庫——辨識有錯的話,之後直接在
     Notion 裡修正就好。</p>

  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <form method="post" enctype="multipart/form-data" id="upload-form">
    <input type="file" name="photo" accept="image/*" capture="environment" required>
    <button type="submit">辨識並寫入 Notion</button>
  </form>
  <p id="processing" hidden>辨識中,請稍候…</p>

  <script>
    document.getElementById("upload-form").addEventListener("submit", function () {
      document.getElementById("processing").hidden = false;
    });
  </script>
{% endblock %}
